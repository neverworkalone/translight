<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Translight AP News live layout reproduction</title>
    <style>
      html { scroll-behavior: auto; }
      body {
        margin: 0;
        color: #111;
        background: #fff;
        font: 16px/1.5 Arial, sans-serif;
      }
      #report {
        position: fixed;
        z-index: 10;
        top: 0;
        right: 0;
        width: 460px;
        max-height: 90vh;
        overflow: auto;
        box-sizing: border-box;
        padding: 12px;
        background: #111827;
        color: white;
        font: 12px/1.4 monospace;
        white-space: pre-wrap;
      }
      .Page-trending {
        width: 760px;
        margin: 24px auto;
        padding: 8px;
        color: white;
        background: #000;
      }
      .PageListTrending-contents {
        display: grid;
        grid-auto-flow: column;
        grid-auto-columns: max-content;
        width: max-content;
        gap: 16px;
        white-space: nowrap;
      }
      .PageList-items {
        display: flex;
        gap: 16px;
      }
      .PageList-items-item,
      .PagePromoTrending,
      bsp-custom-headline,
      .PagePromo-title {
        display: flex;
        align-items: center;
        white-space: nowrap;
      }
      .PagePromo-title {
        width: 122px;
        min-width: 0;
      }
      .PagePromo-title a {
        color: white;
        font-size: 14px;
        line-height: 17px;
        white-space: nowrap;
      }
      .LiveBlogPage-headline-sticky {
        width: 760px;
        margin: 24px auto;
      }
      .sticky-content {
        display: flex;
        align-items: center;
        width: 100%;
        height: 36px;
      }
      .LiveBlogPage-liveButton {
        display: flex;
        align-items: center;
        gap: 5px;
        flex: 0 0 50px;
        width: 50px;
        height: 36px;
        color: #e11;
        white-space: normal;
      }
      .live-dot {
        display: block;
        flex: 0 0 5px;
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #e11;
      }
      .live-text {
        display: block;
        font-size: 20px;
        line-height: 24px;
      }
      .LiveBlogPage-tabs {
        display: flex;
        align-items: center;
        flex: 1 1 auto;
        gap: 10px;
        min-width: 0;
        overflow: auto;
        white-space: nowrap;
      }
      .LiveBlogPage-tab {
        display: grid;
        flex: 0 1 auto;
        min-width: 0;
        padding: 5px 8px;
        color: #111;
        background: #eee;
        white-space: nowrap;
      }
      .article {
        width: min(720px, calc(100% - 48px));
        margin: 48px auto;
      }
      .article h1 { margin: 0 0 24px; font-size: 42px; line-height: 1.05; }
      .article p { margin: 0; font-size: 18px; line-height: 28px; }
    </style>
  </head>
  <body>
    <pre id="report">starting…</pre>

    <div class="Page-trending">
      <div class="PageListTrending-contents">
        <div class="PageList-items">
          <div class="PageList-items-item">
            <div class="PagePromoTrending">
              <bsp-custom-headline custom-headline="div">
                <div id="trend-mass" class="PagePromo-title">
                  <a href="/mass-visa-revocation">Mass visa revocation</a>
                </div>
              </bsp-custom-headline>
            </div>
          </div>
          <div class="PageList-items-item">
            <div class="PagePromoTrending">
              <bsp-custom-headline custom-headline="div">
                <div id="trend-mail" class="PagePromo-title">
                  <a href="/mail-voting">Mail voting</a>
                </div>
              </bsp-custom-headline>
            </div>
          </div>
          <div class="PageList-items-item">
            <div class="PagePromoTrending">
              <bsp-custom-headline custom-headline="div">
                <div id="trend-approval" class="PagePromo-title">
                  <a href="/approval-ratings">Approval ratings</a>
                </div>
              </bsp-custom-headline>
            </div>
          </div>
          <div class="PageList-items-item">
            <div class="PagePromoTrending">
              <bsp-custom-headline custom-headline="div">
                <div id="trend-garden" class="PagePromo-title">
                  <a href="/white-house-rose-garden">White House Rose Garden</a>
                </div>
              </bsp-custom-headline>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="LiveBlogPage-headline-sticky">
      <div class="sticky-content">
        <div id="live-source" class="LiveBlogPage-liveButton">
          <span class="live-dot"></span>
          <span class="live-text">LIVE</span>
        </div>
        <div class="LiveBlogPage-tabs">
          <div id="all-source" class="LiveBlogPage-tab">ALL</div>
          <div id="breaking-source" class="LiveBlogPage-tab">BREAKING NEWS UPDATES</div>
        </div>
      </div>
    </div>

    <main class="article">
      <h1 id="article-title">FACT FOCUS: Canada and the US power grid</h1>
      <p id="article-body">Experts explain why a change in electricity exports would not cause massive blackouts.</p>
    </main>
    <script type="module" src="/tests/fixtures/apnews-live-layout-repro.js"></script>
  </body>
</html>
