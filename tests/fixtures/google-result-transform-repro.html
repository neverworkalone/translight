<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Google result translation placement reproduction</title>
    <style>
      html, body { min-height: 100%; }
      body {
        margin: 0;
        padding: 48px;
        box-sizing: border-box;
        background: #f8f9fa;
        color: #202124;
        font: 16px/1.5 Arial, sans-serif;
      }
      #report {
        position: fixed;
        z-index: 10;
        top: 12px;
        right: 12px;
        width: 380px;
        padding: 12px;
        box-sizing: border-box;
        background: #111827;
        color: white;
        font: 12px/1.4 ui-monospace, monospace;
        white-space: pre-wrap;
      }
      #google-results { width: min(760px, 100%); margin: 80px auto; }
      .result { padding: 24px; background: white; }
      .result-link {
        display: flex;
        flex-direction: column-reverse;
        color: inherit;
        text-decoration: none;
      }
      .result-title {
        display: flex;
        margin: 0;
        color: #1a0dab;
        font-size: 28px;
        font-weight: 400;
        line-height: 1.25;
      }
      #google-results .result-link > translight-translation,
      #google-results .result-link > translight-translation > span {
        transform: rotate(180deg) !important;
      }
    </style>
  </head>
  <body>
    <pre id="report">starting…</pre>
    <main id="google-results">
      <article class="result">
        <a class="result-link" href="https://neverworkalone.net/">
          <h3 class="result-title" id="source">Never Work Alone: Because life and work are team sports.</h3>
        </a>
      </article>
    </main>
    <script type="module" src="/tests/fixtures/google-result-transform-repro.js"></script>
  </body>
</html>
