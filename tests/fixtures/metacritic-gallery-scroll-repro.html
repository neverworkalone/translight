<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Translight Metacritic gallery scroll reproduction</title>
    <style>
      :root { font: 16px/1.5 system-ui, sans-serif; color: #172033; }
      body { margin: 0; background: #f5f7fb; }
      #report-panel {
        position: fixed;
        inset: 0 0 auto;
        z-index: 10;
        padding: 12px 16px;
        background: #172033;
        color: #fff;
      }
      #report { max-height: 22vh; margin: 0; overflow: auto; white-space: pre-wrap; font: 12px/1.4 ui-monospace, monospace; }
      #metacritic-root { max-width: 920px; margin: 0 auto; padding: 150px 24px 48px; }
      [data-testid="gallery-item"] { margin: 0 0 24px; padding: 24px; background: #fff; border: 1px solid #d9dfeb; border-radius: 8px; }
      [data-testid="gallery-item"] > div:first-child { display: flex; align-items: center; justify-content: space-between; gap: 16px; border-bottom: 1px solid #d9dfeb; padding-bottom: 8px; }
      [data-testid="gallery-item"] h2 { margin: 0; font-size: 28px; }
      [data-testid="gallery-item"] h2 a { color: inherit; text-decoration: none; }
      [data-testid="gallery-item"] > p { margin: 0; white-space: nowrap; }
      [data-testid="gallery-item-metascore"] { display: flex; align-items: center; gap: 12px; padding-top: 10px; }
      [data-testid="gallery-item-metascore-score"] { width: 64px; height: 64px; display: grid; place-items: center; background: #00ce7a; font-size: 32px; font-weight: 700; border-radius: 6px; }
      [data-testid="gallery-item-image"] { display: block; width: 100%; aspect-ratio: 16 / 9; margin: 8px 0; overflow: hidden; background: linear-gradient(135deg, #2b3855, #7383a4); }
      [data-testid="gallery-item-image"] img { display: block; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 40ms linear; }
      [data-testid="gallery-item-image"] img.loaded { opacity: 1; }
      [data-testid="gallery-item-credit"] { margin: 4px 0 24px; font-size: 14px; font-weight: 700; }
      .gallery-copy { display: block; }
      .gallery-copy p { margin: 0 0 18px; }
      translight-translation { display: block; margin: 0 0 18px; }
    </style>
  </head>
  <body>
    <div id="report-panel"><pre id="report">Running Metacritic gallery scroll reproduction…</pre></div>
    <main id="metacritic-root"></main>
    <script type="module" src="/tests/fixtures/metacritic-gallery-scroll-repro.js"></script>
  </body>
</html>
